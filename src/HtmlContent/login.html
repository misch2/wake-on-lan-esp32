R"HTML(
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WOL Admin &ndash; Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f0f2f5; }
    .login-card { max-width: 380px; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
<div class="login-card w-100 mx-3">
  <div class="text-center mb-4">
    <h3 class="fw-bold">&#128268; Wake on LAN</h3>
    <p class="text-muted mb-0">Admin login</p>
  </div>
  <div class="card shadow">
    <div class="card-body p-4">
      <div id="err" class="alert alert-danger d-none" role="alert"></div>
      <form id="login-form" onsubmit="doLogin(event)" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="inp-username">Username</label>
          <input type="text" class="form-control" id="inp-username"
            placeholder="Enter username" required autofocus autocomplete="username" />
          <div class="invalid-feedback">Username is required.</div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="inp-password">Password</label>
          <input type="password" class="form-control" id="inp-password"
            placeholder="Enter password" required autocomplete="current-password" />
          <div class="invalid-feedback">Password is required.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="login-btn">Login</button>
      </form>
    </div>
  </div>
</div>
<script>
  async function doLogin(e) {
    e.preventDefault();
    const form = document.getElementById('login-form');
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('err');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span>&nbsp;Logging in&hellip;';
    err.classList.add('d-none');
    try {
      const r = await fetch('/api/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          username: document.getElementById('inp-username').value,
          password: document.getElementById('inp-password').value,
        }),
      });
      if (r.ok) {
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next');
        // Only follow same-origin relative paths to prevent open-redirect attacks.
        window.location.href = (next && next.startsWith('/') && !next.startsWith('//')) ? next : '/admin';
      } else {
        const data = await r.json().catch(() => ({}));
        err.textContent = data.error || 'Login failed.';
        err.classList.remove('d-none');
      }
    } catch (ex) {
      err.textContent = 'Request failed: ' + ex.message;
      err.classList.remove('d-none');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Login';
    }
  }
</script>
</body>
</html>
)HTML"
